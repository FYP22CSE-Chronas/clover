name: synthetic_ric

# Generated by experiments/ric_clover/build_synthetic_ric.py. Model and training
# settings copy configs/datasets/labour.yaml so the synthetic isolates the dependence
# mechanism under the same architecture CLOVER uses on Labour.
data:
  dir: experiments/ric_clover/data/synthetic_ric
  h: 12
  input_size: 36
  split: {strategy: rolling, origins: 4}
  levels:
    Total: [0, 1]
    Region: [1, 5]
    Region/Gender: [5, 13]
    Bottom: [13, 29]

features:
  static: []
  future: []

model:
  temp_conv_channels: 20
  dilations: [1, 2, 3, 6, 12]
  cross_series_hidden: 0
  static_encoder_dim: 10
  future_encoder_dim: 20
  horizon_specific_dim: 5
  horizon_agnostic_dim: 10
  n_factors: 20

train:
  learning_rate: 1.0e-3
  max_steps: 2000
  early_stop_patience: 4
  val_check_steps: 50
  val_mc_samples: 500

name: energy-grid-fuel

data:
  dir: ../datasets/energy-grid-fuel
  h: 24
  input_size: 168
  split: {strategy: last_h}
  levels:
    Total: [0, 1]
    GenerationFamily: [1, 5]
    FuelTechnology: [5, 16]

features:
  static: []
  future:
    - {type: dayofweek_dummies}
    - {type: seasonal_naive_anchor, lags: [24, 168]}

model:
  temp_conv_channels: 20
  dilations: [1, 2, 4, 8, 16, 24]
  cross_series_hidden: 50
  static_encoder_dim: 10
  future_encoder_dim: 20
  horizon_specific_dim: 5
  horizon_agnostic_dim: 10
  n_factors: 8

train:
  learning_rate: 1.0e-3
  max_steps: 2000
  early_stop_patience: 5
  val_check_steps: 50
  val_mc_samples: 500

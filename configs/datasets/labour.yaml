name: labour

data:
  dir: data/raw/labour
  h: 12
  input_size: 36
  split: {strategy: last_h}
  end_date: "2019-12-31"
  levels:
    Total: [0, 1]
    Geography: [1, 9]
    Gender/Geography: [9, 25]
    Status/Gender/Geography: [25, 57]

features:
  static: []
  future: []

model:
  temp_conv_channels: 20
  dilations: [1, 2, 3, 6, 12]
  cross_series_hidden: 0      # 0 disables the cross-series mixer
  static_encoder_dim: 10
  future_encoder_dim: 20
  horizon_specific_dim: 5
  horizon_agnostic_dim: 10
  n_factors: 20

train:
  learning_rate: 1.0e-3
  max_steps: 2000
  early_stop_patience: 4
  val_check_steps: 50
  val_mc_samples: 500

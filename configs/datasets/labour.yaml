name: labour

data:
  dir: data/raw/labour
  h: 12
  input_size: 36
  split: {strategy: last_h}
  end_date: "2019-12-31"
  levels:
    Total: [0, 1]
    Geography: [1, 9]
    Gender/Geography: [9, 25]
    Status/Gender/Geography: [25, 57]

# The paper's Table 4 gives Labour a static and a future encoder. Bottom names are
# list strings like "['Employed full-time', 'Females', 'Victoria']", hence the
# separator. Without these features CLOVER scores 0.0081 overall here, 0.0077 with
# them (the paper reports 0.0074).
features:
  static:
    - {type: grouped_static_dummies, keys: [status, gender, geography],
       sep: "', '", positions: [0, 1, 2]}
  future:
    - {type: month_dummies}

model:
  temp_conv_channels: 20
  dilations: [1, 2, 3, 6, 12]
  cross_series_hidden: 0      # 0 disables the cross-series mixer
  static_encoder_dim: 10
  future_encoder_dim: 20
  horizon_specific_dim: 5
  horizon_agnostic_dim: 10
  n_factors: 20

train:
  learning_rate: 1.0e-3
  max_steps: 2000
  early_stop_patience: 4
  val_check_steps: 50
  val_mc_samples: 500

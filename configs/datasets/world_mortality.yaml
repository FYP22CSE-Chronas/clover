name: world_mortality

data:
  dir: data/raw/world_mortality
  h: 12
  input_size: 24
  split: {strategy: last_h}
  # Monthly mortality: world total, six continents, then countries.
  levels:
    Total: [0, 1]
    Continent: [1, 7]
    Country: [7, 135]

features:
  static:
    # Bottom names are list literals like "['Algeria', 'Africa']".
    - {type: list_static_dummies, keys: [continent], positions: [1]}
  future:
    - {type: month_dummies}
    - {type: seasonal_naive_anchor, lags: [12]}

model:
  temp_conv_channels: 30
  # Receptive field 4 stays under input_size 24.
  dilations: [1, 2]
  cross_series_hidden: 50
  static_encoder_dim: 20
  future_encoder_dim: 10
  horizon_specific_dim: 5
  horizon_agnostic_dim: 10
  n_factors: 5

train:
  learning_rate: 0.00089149
  weight_decay: 0.0001
  max_steps: 2000
  early_stop_patience: 5
  val_check_steps: 100
  val_mc_samples: 300

name: synthetic_coint

# Generated by scripts/build_synthetic_coint.py: four groups of four cointegrated
# series sharing a common stochastic trend each, with slowly reverting deviations.
data:
  dir: data/raw/synthetic_coint
  h: 12
  input_size: 24
  split: {strategy: rolling, origins: 5}
  levels:
    Total: [0, 1]
    Group: [1, 5]
    Bottom: [5, 21]

features:
  static:
    - {type: identity_dummies}
  future:
    - {type: month_dummies}

model:
  temp_conv_channels: 10
  dilations: [1, 2, 4, 8]
  cross_series_hidden: 50
  static_encoder_dim: 8
  future_encoder_dim: 8
  horizon_specific_dim: 5
  horizon_agnostic_dim: 10
  n_factors: 8

train:
  learning_rate: 1.0e-3
  max_steps: 1500
  early_stop_patience: 5
  val_check_steps: 50
  val_mc_samples: 200

name: traffic

data:
  dir: data/raw/traffic
  h: 1
  input_size: 56
  split: {strategy: block, train: 120, val: 120, test: 27}
  levels:
    Total: [0, 1]
    Halves: [1, 3]
    Quarters: [3, 7]
    Lanes: [7, 207]

features:
  static:
    - {type: identity_dummies}
  future:
    - {type: weekend_indicator}
    - {type: saturday_proximity}
    - {type: dayofweek_dummies}
    - {type: seasonal_naive_anchor, lags: [1, 7]}

model:
  temp_conv_channels: 10
  dilations: [1, 7, 14, 28]
  cross_series_hidden: 200
  static_encoder_dim: 5
  future_encoder_dim: 20
  horizon_specific_dim: 5
  horizon_agnostic_dim: 20
  n_factors: 10

train:
  learning_rate: 5.0e-3
  max_steps: 2000
  early_stop_patience: 5
  val_check_steps: 50
  val_mc_samples: 200

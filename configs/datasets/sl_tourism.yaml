name: sl_tourism

data:
  dir: data/raw/sl_tourism
  h: 12
  input_size: 24
  split: {strategy: last_h}
  # Monthly tourist arrivals: total, six continents, regions, then countries.
  levels:
    Total: [0, 1]
    Continent: [1, 7]
    Region: [7, 23]
    Country: [23, 223]

features:
  static:
    # Bottom names are list literals like "['Afghanistan', 'South Asia', 'Asia']".
    - {type: list_static_dummies, keys: [continent, region], positions: [2, 1]}
  future:
    - {type: month_dummies}
    - {type: seasonal_naive_anchor, lags: [12]}

model:
  temp_conv_channels: 10
  dilations: [1, 2, 4, 8]
  cross_series_hidden: 100
  static_encoder_dim: 10
  future_encoder_dim: 50
  horizon_specific_dim: 5
  horizon_agnostic_dim: 20
  n_factors: 5

train:
  learning_rate: 0.00062342
  weight_decay: 0.0
  max_steps: 2000
  early_stop_patience: 5
  val_check_steps: 100
  val_mc_samples: 300

name: favorita
# A panel, not a single hierarchy: 4,036 grocery items, each an independent copy of the
# same 93-row store geography (national / 16 states / 22 cities / 54 stores), 375,348
# series in all. Loaded by data/favorita.py into a PanelDataset and run by
# pipeline/panel_runner.py;

data:
  dir: data/favorita/panel
  h: 34
  # The dilated stack sees 1 + sum([1,2,4,8,16,32]) = 64 steps, so 96 is the smallest
  # multiple of 4 weeks that covers its receptive field.
  input_size: 96
  split: {strategy: block, train: 1620, val: 34, test: 34}

# Static, historical and future blocks come from the panel loader rather than the
# feature registry: they are per-item and per-store, not functions of the calendar
# alone. Perishability + state dummies (static), transactions (historical),
# promotions + day of week (future).
features: {}

model:
  temp_conv_channels: 30
  dilations: [1, 2, 4, 8, 16, 32]
  cross_series_hidden: 5
  static_encoder_dim: 20
  future_encoder_dim: 50
  horizon_specific_dim: 5
  horizon_agnostic_dim: 20
  n_factors: 5

train:
  learning_rate: 5.0e-4
  max_steps: 80000
  batch_size: 4
  # 0 disables early stopping; the final weights are the ones evaluated.
  early_stop_patience: 0
  restore_best: false
  # Validation is 4,036 windows; checking all of them every 100 steps would cost more
  # than the training run itself.
  val_check_steps: 2000
  checkpoint_every: 2000
  val_mc_samples: 100
  # Sales are non-negative counts with many zeros, so a scale-only normalizer beats
  # the standard z-score here.
  scaler: mean_floor
  # Normalizing by each batch's target mass explodes when a batch of four sparse items
  # carries almost none. sCRPS is a ratio of sums over the whole test set, so the raw
  # sum is the better minibatch objective.
  normalize_loss: false
